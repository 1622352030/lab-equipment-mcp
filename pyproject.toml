[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lab-equipment-mcp"
version = "0.1.0"
description = "Extensible MCP server for laboratory equipment over VISA"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "1622352030" }]
keywords = [
  "mcp",
  "tektronix",
  "gw-instek",
  "agilent",
  "keysight",
  "siglent",
  "sdg1062x",
  "33500b",
  "dpo2012b",
  "afg-2125",
  "m8811",
  "maynuo",
  "fluke",
  "8808a",
  "multimeter",
  "power-supply",
  "oscilloscope",
  "function-generator",
  "visa",
  "usbtmc",
  "serial",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
urls = { Repository = "https://github.com/1622352030/lab-equipment-mcp", Issues = "https://github.com/1622352030/lab-equipment-mcp/issues" }
dependencies = [
  "mcp>=1.28.1,<2",
  "pyvisa>=1.15,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
start-lab-equipment-mcp = "lab_equipment_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_equipment_mcp"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.git",
  "/.venv",
  "/.uv-cache",
  "/dist",
  "/waveforms",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
