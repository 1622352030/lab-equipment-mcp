name: Feature request
description: 建议不依赖新增仪器型号的功能
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and compatibility impact
  - type: checkboxes
    id: safety
    attributes:
      label: Safety impact
      options:
        - label: This proposal changes real instrument state or output behavior.
        - label: This proposal is read-only or does not access hardware.

